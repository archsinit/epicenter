name: Intel macOS build

on:
  workflow_dispatch:
  push:
    branches: [whispering-intel]
    paths:
      - 'apps/whispering/**'
      - 'packages/**'
      - 'bun.lock'
      - 'scripts/verify-intel-app.sh'
      - 'scripts/test-intel-verification.sh'
      - 'scripts/no-telemetry.test.ts'
      - 'scripts/menu-bar.test.ts'
      - 'scripts/test-meeting-native.sh'
      - 'scripts/test-meeting-core.sh'
      - 'scripts/meeting-controls.test.ts'
      - '.github/workflows/intel-macos.yml'

permissions:
  contents: read

concurrency:
  group: intel-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/whispering/src-tauri -> target
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test verification failure propagation
        run: bash scripts/test-intel-verification.sh
      - name: Check frontend types
        run: bun run --cwd apps/whispering check
      - name: Test fork indicator, cleanup and input policies
        run: bun test scripts/no-telemetry.test.ts scripts/menu-bar.test.ts apps/whispering/src/lib/query/indicator.test.ts apps/whispering/src/lib/query/cleanup-policy.test.ts apps/whispering/src/lib/services/hold-gate.test.ts apps/whispering/src/lib/components/companion-motion.test.ts apps/whispering/src/lib/services/transcription/cloud/openai-request.test.ts apps/whispering/src/lib/services/capture-lease.test.ts scripts/meeting-controls.test.ts
      - name: Test hidden native companion travel
        run: |
          xcrun clang -fobjc-arc -Werror -mmacosx-version-min=10.15 \
            apps/whispering/src-tauri/src/indicator_panel.m \
            scripts/integration/gastly-travel-host-test.m \
            -framework AppKit -framework QuartzCore -o /tmp/gastly-travel-host-test
          /tmp/gastly-travel-host-test
      - name: Test synthetic native meeting capture bridge
        run: bash scripts/test-meeting-native.sh
      - name: Build Intel Mac app
        working-directory: apps/whispering
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun tauri build --target x86_64-apple-darwin --bundles app
      - name: Test native audio meter, mouse and meeting core
        working-directory: apps/whispering/src-tauri
        run: cargo test --lib --target x86_64-apple-darwin
      - name: Verify Intel bundle and smoke-test app startup
        run: |
          set -o pipefail
          bash scripts/verify-intel-app.sh \
            'apps/whispering/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Whispering Intel.app' \
            2>&1 | tee Whispering-Intel-validation.txt
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Whispering-Intel-validation
          path: Whispering-Intel-validation.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            'apps/whispering/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Whispering Intel.app' \
            Whispering-Intel-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Whispering-Intel-macOS
          path: |
            Whispering-Intel-macOS.zip
            Whispering-Intel-validation.txt
          retention-days: 14
